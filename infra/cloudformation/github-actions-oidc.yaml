AWSTemplateFormatVersion: 2010-09-09
Description: >-
  GitHub Actions OIDC trust. Creates the OpenID Connect provider for
  token.actions.githubusercontent.com and a deploy role the workflow assumes
  via aws-actions/configure-aws-credentials. Scoped to a single repo/branch.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: >-
      The GitHub environment this account serves. Scopes the role's trust policy
      so the role can only be assumed by this repo on this environment.
  RoleName:
    Type: String
    Default: mock-exams-website-github-actions-deploy
    Description: >-
      Name of the role that GitHub Actions will assume to deploy the website.
  OidcThumbprint:
    Type: String
    Default: 1c58a3a8518e8759bf075b76b750d4f2df264fcd
    Description: >-
      SHA-1 fingerprint of the GitHub Actions OIDC server certificate.

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - !Ref OidcThumbprint
      Tags:
        - Key: Environment
          Value: exam-generator-website
        - Key: Environment
          Value: !Ref Environment

DeployRole:
  Type: AWS::IAM::Role
  Properties:
    RoleName: !Ref RoleName
    AssumeRolePolicyDocument:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Principal:
            Federated: !GetAtt GithubActionsOidcProvider.Arn
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
            # GitHub's OIDC subject varies by event (workflow_dispatch may
            # emit a ref:- or environment:-based sub), so scope to the repo
            # rather than a fixed suffix. Each environment's role lives in its
            # own account, so this still cannot cross accounts.
            StringLike:
              token.actions.githubusercontent.com:sub:
                - !Sub "repo:Alaksion@30579274/exam-generator-website@1320696368:environment:${Environment}"
    # SAM deploys touch CloudFormation, IAM, Lambda, API Gateway, Cognito,
    # DynamoDB, SQS, S3, Bedrock, and Secrets Manager. AdministratorAccess is
    # the pragmatic start for an account-scoped, OIDC-locked role; swap it for
    # a least-privilege policy after launch if desired.
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AdministratorAccess
    MaxSessionDuration: 3600
    Tags:
      - Key: Project
        Value: exam-generator
      - Key: Environment
        Value: !Ref Environment

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME secret for the GitHub environment.
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Description: The GitHub Actions OIDC provider ARN for this account.
    Value: !GetAtt GithubActionsOidcProvider.Arn
