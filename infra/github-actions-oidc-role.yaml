AWSTemplateFormatVersion: 2010-09-09
Description: >-
  GitHub Actions deploy role for this repo. Creates only the role the workflow
  assumes via aws-actions/configure-aws-credentials. The OIDC provider for
  token.actions.githubusercontent.com is a shared account-level resource owned
  by the backend repo's bootstrap, so this template references it instead of
  creating it.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: >-
      The GitHub environment this account serves. Scopes the role's trust policy
      so the role can only be assumed by this repo on this environment.
  RoleName:
    Type: String
    Default: mock-exams-website-github-actions-deploy
    Description: >-
      Name of the role that GitHub Actions will assume to deploy the website.

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub's OIDC subject varies by event (workflow_dispatch may
              # emit a ref:- or environment:-based sub), so scope to the repo
              # rather than a fixed suffix. Each environment's role lives in its
              # own account, so this still cannot cross accounts.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:Alaksion@30579274/exam-generator-website@1320696368:environment:${Environment}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      MaxSessionDuration: 3600
      Tags:
        - Key: Project
          Value: exam-generator
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_ROLE_TO_ASSUME secret for the GitHub environment.
    Value: !GetAtt DeployRole.Arn
  OidcProviderArn:
    Description: The shared GitHub Actions OIDC provider ARN for this account.
    Value: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"