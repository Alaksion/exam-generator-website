name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  STAGE: ${{ vars.DEPLOY_STAGE || 'prod' }}
  STACK_NAME: mock-exams-website-${{ vars.DEPLOY_STAGE || 'prod' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_USER_POOL_ID: ${{ secrets.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ secrets.VITE_USER_POOL_CLIENT_ID }}
          VITE_USER_POOL_DOMAIN: ${{ secrets.VITE_USER_POOL_DOMAIN }}
          VITE_OAUTH_CALLBACK_PATH: ${{ vars.VITE_OAUTH_CALLBACK_PATH || '/auth/callback' }}
          VITE_SOCIAL_GOOGLE_ENABLED: ${{ vars.VITE_SOCIAL_GOOGLE_ENABLED || 'false' }}
          VITE_SOCIAL_APPLE_ENABLED: ${{ vars.VITE_SOCIAL_APPLE_ENABLED || 'false' }}
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: ${{ vars.DEPLOY_STAGE || 'prod' }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve stack outputs
        id: stack
        run: |
          outputs=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs" --output json)
          echo "bucket=$(echo "$outputs" | jq -r '.[] | select(.OutputKey == "BucketName") | .OutputValue')" >> "$GITHUB_OUTPUT"
          echo "distribution=$(echo "$outputs" | jq -r '.[] | select(.OutputKey == "DistributionId") | .OutputValue')" >> "$GITHUB_OUTPUT"

      - name: Sync build to S3
        run: >-
          aws s3 sync dist s3://${{ steps.stack.outputs.bucket }}
          --delete
          --exclude "index.html"
          --cache-control "public, max-age=31536000, immutable"
          --no-progress

      - name: Upload index.html without cache
        run: >-
          aws s3 cp dist/index.html s3://${{ steps.stack.outputs.bucket }}/index.html
          --cache-control "no-cache"
          --content-type "text/html"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ steps.stack.outputs.distribution }}
          --paths "/*"
          --no-cli-pager
